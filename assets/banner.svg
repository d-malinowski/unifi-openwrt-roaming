<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">UniFi + OpenWRT — interlocked networks</title>
<desc id="desc">Plain UniFi and OpenWRT text inside cyan and peach interlocking loops, connected through a shared roaming link. Purple sunset, ASCII details and scanlines preserve a retro terminal style. No graphical brand logos are used. Unofficial community artwork.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#2b193a"/><stop offset="1" stop-color="#141023"/></linearGradient>
  <linearGradient id="sun" x2="0" y2="1"><stop stop-color="#ffc98a"/><stop offset="1" stop-color="#fc74b0"/></linearGradient>
  <linearGradient id="mix"><stop stop-color="#7cddff"/><stop offset=".5" stop-color="#f99ed9"/><stop offset="1" stop-color="#ffd09d"/></linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3H4" stroke="#000" stroke-opacity=".14"/></pattern>
</defs>
<rect width="1280" height="440" rx="20" fill="url(#bg)"/>
<circle cx="640" cy="192" r="156" fill="url(#sun)" opacity=".09"/>
<path d="M0 342H1280M0 379H1280M0 422H1280M640 320L80 440M640 320L355 440M640 320L925 440M640 320L1200 440" stroke="#f492ca" stroke-opacity=".1"/>
<g font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6b3ce">
  <text x="44" y="39">+-- INTEROPERABILITY / OPEN SOURCE</text><text x="1236" y="39" text-anchor="end">[ 802.11r ENABLED ]</text>
</g>
<!-- Interlocking loops contain plain text, not graphical brand logos. -->
<rect x="333" y="83" width="350" height="197" rx="98" fill="#142337" fill-opacity=".65" stroke="#83dfff" stroke-width="4"/>
<rect x="597" y="83" width="350" height="197" rx="98" fill="#352132" fill-opacity=".5" stroke="#ffcb98" stroke-width="4"/>
<path d="M683 182C683 236 639 280 585 280" fill="none" stroke="#83dfff" stroke-width="4"/>
<g font-family="Consolas, 'Liberation Mono', monospace" font-weight="bold" text-anchor="middle">
  <text x="473" y="198" fill="#a1e6ff" font-size="48">UniFi</text>
  <text x="809" y="196" fill="#ffd8b0" font-size="38">OpenWRT</text>
</g>
<g text-anchor="middle" font-family="Consolas, 'Liberation Mono', monospace" font-weight="bold">
  <text x="640" y="173" fill="#ffcce8" font-size="23">&lt;+&gt;</text><text x="640" y="202" fill="#f5d4eb" font-size="12">LINKED</text>
</g>
<path d="M226 182H333M947 182H1043" stroke="url(#mix)" stroke-width="2" stroke-dasharray="4 6"/>
<g text-anchor="middle" font-family="Consolas, 'Liberation Mono', monospace">
  <text x="640" y="331" fill="#fff0e5" font-size="27" font-weight="bold">unifi-openwrt-roaming</text>
  <text x="640" y="377" fill="#fff0e5" font-size="21" font-weight="bold">ONE NETWORK. SEAMLESS ROAMING.</text>
  <text x="640" y="409" fill="#c6adce" font-size="13">[ two platforms / one continuous connection ]</text>
</g>
<rect width="1280" height="440" rx="20" fill="url(#scan)" pointer-events="none"/>
</svg>
